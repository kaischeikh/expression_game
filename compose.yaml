services:
  expression_game:
    build:
      context: .
    command: >
      streamlit run src/games/app/streamlit_app.py
      --server.headless=true
      --server.address=0.0.0.0
      --server.port=8000
    ports:
      - "8000:8000"

  trivia:
    build:
      context: .
    command: >
      streamlit run src/games/app/streamlit_trivia.py
      --server.headless=true
      --server.address=0.0.0.0
      --server.port=8001
    ports:
      - "8001:8000"
    environment:
      - QUESTIONS_DB_PATH=${QUESTIONS_DB_PATH:-/app/data/questions.db}
    volumes:
      - ${QUESTIONS_DB_VOLUME:-questions-db}:/app/data
    depends_on:
      question_bank_generator:
        condition: service_completed_successfully

  question_bank_generator:
    build:
      context: .
    command: >
      python scripts/question_bank_generator.py
    environment:
      - QUESTIONS_DB_PATH=${QUESTIONS_DB_PATH:-/app/data/questions.db}
      - MINIMAL_NUMBER_OF_QUESTIONS=${MINIMAL_NUMBER_OF_QUESTIONS:-0}
    volumes:
      - ${QUESTIONS_DB_VOLUME:-questions-db}:/app/data
